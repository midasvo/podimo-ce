name: Build and Push Docker Image (Rust)

# Parallel image for the Rust rewrite. Publishes to ghcr.io/midasvo/podimo-rs
# (separate from the Python image at ghcr.io/midasvo/podimo-ce). Triggers are
# scoped to `rust/**` so Python-only changes don't fire this workflow, and
# disabled on the draft `rust-rewrite` branch — until merge or a manual run,
# this never publishes.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'rust/**'
      - '.github/workflows/docker-publish-rs.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: midasvo/podimo-rs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./rust
          file: ./rust/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=podimo-rs
          cache-to: type=gha,mode=max,scope=podimo-rs
